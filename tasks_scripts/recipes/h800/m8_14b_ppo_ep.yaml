
# ============== M8 14B GRPO ==============
# reference trial: https://ml.byteintl.net/development/instance/jobs/f74e0dba291cae38?tabState=run_info&trialId=9916555
# ===============================================

actor_rollout_ref:
  model:
    enable_gradient_checkpointing: True
  actor:
    use_dynamic_bsz: True
    ppo_max_token_len: 49152
    fsdp_size: 256
    tp_size: 2
    ulysses_sequence_parallel_size: 4
    fsdp_config:
      param_offload: False
      use_orig_params: True
    profile:
      enable: True
      upload_to_mlx: True
      filename: "actor_ep"
      profile_on_ranks: [0,8,16,24]
  ref:
    use_dynamic_bsz: True
    max_token_len: 49152
    fsdp_size: 256
    tp_size: 2
    ulysses_sequence_parallel_size: 4
    fsdp_config:
      param_offload: True
      use_orig_params: True
  rollout:
    max_token_len: 24576
    tensor_model_parallel_size: 8

critic:
  model:
    enable_gradient_checkpointing: True
    fsdp_config:
      param_offload: False
      use_orig_params: True
  fsdp_size: 256
  tp_size: 2
  ulysses_sequence_parallel_size: 4
  ppo_max_token_len: 49152
  profile:
    enable: True
    upload_to_mlx: True
    filename: "critic_ep"
    profile_on_ranks: [0,8,16,24]

trainer:
  offload_train_memory: True
