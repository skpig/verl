mariana:
  megatron:
    tensor_parallel_size: 8
    pipeline_parallel_size: 9
    virtual_pipeline_parallel_size: 12
    offload_activations: True
    offload_ratio: 1

  model_implementation:
    noop_transformer_layers: [1, 108]
    janus_use_big_op: True
    janus_big_op_version: P7V3Recompute
    moe_pr_expert_type: swiglu-default

actor_rollout_ref:
  actor:
    ppo_max_token_len: -1
    strategy: megatron
  ref:
    max_token_len: -1
    strategy: megatron
  rollout:
    max_token_len: -1
    tensor_model_parallel_size: 8

critic:
  ppo_max_token_len: -1
  strategy: megatron

trainer:
  offload_train_memory: True