data:
  tokenizer: null
  train_files: hdfs://haruna/home/byte_data_seed/lf_lq/user/zhangchi.usc1992/data/rlhf/gsm8k/train_with_ans_new.parquet
  val_files: hdfs://haruna/home/byte_data_seed/lf_lq/user/zhangchi.usc1992/data/rlhf/gsm8k/test_with_ans_new.parquet
  prompt_key: prompt
  answer_key: answer
  use_ref_answer: False
  max_prompt_length: 512
  max_response_length: 512
  train_batch_size: 1024
  val_batch_size: 1312
  return_raw_input_ids: False  # This should be set to true when the tokenizer between policy and rm differs
  return_raw_chat: False
  version: v2
  truncation: error
  shuffle: True
  multi_prompts: none
  num_prompts_per_data: 1
  BITWISE_RESUME: True  # this enables by default. If you seed checkpoint load fails, set to false


# Note that the current megatron config has to be global as it has to be identical for every model
# We may switch to per-model megatron config later when we separate models into different processes.
# During that time, the megatron config will be copied to the namespace under each model
megatron:
  tensor_parallel_size: 2
  pipeline_parallel_size: 4
  virtual_pipeline_parallel_size: 7
  distributed_sequence_parallel_size: 1
  expert_parallel_size: ${megatron.tensor_parallel_size}  # hardcode for now
  micro_batch_size: 1
  global_batch_size: -1
  sequence_parallel: true
  recompute_granularity: ''
  use_flash_attention: true
  recompute_method: uniform
  recompute_num_layers: 1
  distribute_saved_activations: false
  enable_distributed_optimizer: true
  use_multi_precision_ddp: false
  enable_initial_jit_warmup: false
  disable_gradient_accumulation_fusion: true
  switch_pp_and_dp: false
  force_fp32_embed: false
  ddp_impl: local
  bf16_qt: false
  empty_cache_level: 0
  grad_norm_skip: -1.0
  strict_align_diff_with_ds: false
  strict_align_row_para: false
  overlap_data_parallel_communication: false
  mem_efficient_column_parallel: true
  overlap_dp_grad_comm: false
  overlap_dp_param_comm: false
  sequence_data_parallel_size: -1
  vocab_parallel_embedding_fusion: false
  bias_gelu_fusion: false
  use_non_sequential_block: false
  timing_log_level: 0
  timing_log_option: all
  no_load_rng: false
  no_load_optim: false
  overlap_data_parallel_allgather: false
  deallocate_pipeline_outputs: true
  deterministic_flash_attn: false
  early_prefetch_dp_allgather: false
  embedding_reduce_scatter_for_sp: true
  gather_params_use_alltoall: false
  gradient_accumulation_fusion: true
  bias_dropout_fusion: true
  accumulate_allreduce_grads_in_fp32: true
  masked_softmax_fusion: true
  no_save_rng: false
  num_layers_for_pipeline_stages: []
  num_layers_per_virtual_pipeline_stage: 0
  optimizer_offload_main_param: false
  overlap_attn_grad_input_comm: false
  overlap_p2p_comm: false
  parallel_linear_force_weight_contiguous: false
  scale_gradient_after_allreduce: false
  scale_loss_in_gradient: false
  pipeline_strategy: ''
  param_alignment_in_bytes: 16  # this is necessary for H20/H800


# this set of config determines how the mariana model is implemented. The model structure is defined by huggingface config
model_implementation:
  noop_transformer_layers: []

actor_rollout_ref:
  hybrid_engine: True
  model:
    path: hdfs://haruna/home/byte_data_seed/lf_lq/user/zhangchi.usc1992/seed_rl/models/M8_680m_SFT_hf
    external_lib: null
    override_config: {}
    enable_gradient_checkpointing: False
  actor:
    strategy: fsdp  # This is for backward-compatibility
    ppo_mini_batch_size: 512
    ulysses_sequence_parallel_size: 1
    fsdp_size: -1
    ppo_micro_batch_size: 1
    use_dynamic_bsz: True
    ppo_max_token_len: -1
    grad_clip: 1.0
    clip_ratio: 0.2
    clip_ratio2: 10.0
    scale_pg_by_kl: False
    scale_pg_by_local_kl: False
    lm_loss_weight: 0.
    upgo_loss_weight: 0.0
    upgo_loss_version: 1
    kl_loss_weight: 0.0
    kl_penalty: ${algorithm.kl_penalty}
    entropy_coeff: 0.001
    ppo_epochs: 1
    shuffle: True
    use_ewma_loss: False
    optim:
      lr: 1e-5
      betas: [0.9, 0.95]
      eps: 1e-08
      weight_decay: 0.1
      lr_warmup_steps: -1
      lr_warmup_steps_ratio: 0.  # the total steps will be injected during runtime
      min_lr_ratio: null   # only useful for warmup with cosine
      warmup_style: constant  # select from constant/cosine
      total_training_steps: -1  # must be override by program
    fsdp_config:
      wrap_policy:
        # transformer_layer_cls_to_wrap: None
        min_num_params: 0
      param_offload: False
      use_orig_params: ${trainer.ckpt_enable_flatten}
    profile:
      filename: p6_400m_ppo_actor
      profile_on_ranks:
        - 0
      default_hdfs_dir: null
      upload_to_mlx: False
      enable: False
  ref:
    fsdp_config:
      param_offload: True
      wrap_policy:
        # transformer_layer_cls_to_wrap: None
        min_num_params: 0
    log_prob_micro_batch_size: 128
    ulysses_sequence_parallel_size: 1
    fsdp_size: -1
    use_dynamic_bsz: True
    max_token_len: -1
    ema: 1.0
  rollout:
    name: xperf_gpt
    prompt_length: ${data.max_prompt_length}  # for xperf_gpt
    response_length: ${data.max_response_length}
    # for vllm rollout
    dtype: bfloat16 # should align with FSDP
    ignore_eos: False
    enforce_eager: True
    free_cache_engine: True
    load_format: dummy_dtensor
    tensor_model_parallel_size: 2
    max_num_batched_tokens: 8192
    max_num_seqs: 1024
    use_dynamic_bsz: True
    max_token_len: -1
    log_prob_micro_batch_size: 128
    # for xperf_gpt
    micro_batch_size: 2048
    num_bon: 1
    eval_bon: 1
    eval_bon_every: 20
    bon_strategy: "best"
    quant_mode: "NO_QUANT"
    gpu_memory_utilization: 0.7
    train_generate_kwargs:
      top_k: -1 # 0 for hf rollout, -1 for vllm rollout
      top_p: 1.0
      temperature: 1.0
      do_sample: True
      min_p: -1 # 0.01 to open
      eta_epsilon: -1 # 1e-6 to open
    val_generate_kwargs:
      # for validation
      top_k: -1 # 0 for hf rollout, -1 for vllm rollout
      top_p: 0.7
      temperature: 1.0
      do_sample: True
    profile:
      filename: p6_400m_ppo_rollout
      profile_on_ranks:
        - 0
      default_hdfs_dir: null
      upload_to_mlx: False
      enable: False
  use_cuda_timer: False

critic:
  load_score_head: True
  strategy: fsdp
  optim:
    lr: 1e-5
    betas: [0.9, 0.95]
    eps: 1e-08
    weight_decay: 0.1
    lr_warmup_steps: -1
    lr_warmup_steps_ratio: 0.  # the total steps will be injected during runtime
    min_lr_ratio: null   # only useful for warmup with cosine
    warmup_style: constant  # select from constant/cosine
    total_training_steps: -1  # must be override by program
  model:
    path: hdfs://haruna/home/byte_data_seed/lf_lq/user/zhangchi.usc1992/models/deepseek-llm-7b-chat
    tokenizer_path: ${actor_rollout_ref.model.path}
    override_config: {}
    external_lib: ${actor_rollout_ref.model.external_lib}
    enable_gradient_checkpointing: False
    fsdp_config:
      param_offload: False
      wrap_policy:
        # transformer_layer_cls_to_wrap: None
        min_num_params: 0
      use_orig_params: ${trainer.ckpt_enable_flatten}
  ulysses_sequence_parallel_size: 1
  fsdp_size: -1
  NO_DEVICE_MESH: False # handle old critic ckpt stored as ShardedTensor
  ppo_mini_batch_size: ${actor_rollout_ref.actor.ppo_mini_batch_size}
  ppo_micro_batch_size: 1
  use_dynamic_bsz: True
  ppo_max_token_len: -1
  infer_micro_batch_size: 128
  ppo_epochs: 1
  phasic_critic_epochs: 1
  shuffle: ${actor_rollout_ref.actor.shuffle}
  grad_clip: 1.0
  cliprange_value: 0.5
  profile:
    filename: p6_400m_ppo_critic
    profile_on_ranks:
      - 0
    default_hdfs_dir: null
    upload_to_mlx: False
    enable: False
  use_cuda_timer: False

reward_model:
  enable: False
  model:
    input_tokenizer: ${actor_rollout_ref.model.path}  # set this to null if the chat template is identical
    path: hdfs://haruna/home/byte_data_seed/lf_lq/user/zhangchi.usc1992/models/FsfairX-LLaMA3-RM-v0.1
    external_lib: ${actor_rollout_ref.model.external_lib}
    fsdp_config:
      min_num_params: 0
      param_offload: True
      use_orig_params: ${trainer.ckpt_enable_flatten}
  ulysses_sequence_parallel_size: 1
  fsdp_size: -1
  micro_batch_size: 64
  use_dynamic_bsz: True
  max_token_len: -1
  max_length: null
  max_prompt_length: ${data.max_prompt_length}
  max_response_length: ${data.max_response_length}
  mean: 0.0
  std: 1.0
  use_last_response: False
  last_response_strict: False
  reward_executor_maxnum: 128
  last_response_sep: ['<summarize>', '</summarize>']
  reward_0_for_overlong_rsp: False
  add_int_verify: False
  punish_no_answer: v0
  need_punish_duplicate: False
  punish_score: rule-lighteval/MATH_v2:-1,code-sandbox:0
  need_punish_trunc: False
  trunc_punish_score: -5
  strict_box_verify: False
  use_cuda_timer: False

algorithm:
  force_append_eos: False
  phasic_critic_interval: 0
  gamma: 1.0
  lam: 0.95
  adv_estimator: gae
  adv_whiten: True
  kl_penalty: kl  # how to estimate kl divergence
  kl_ctrl:
    type: fixed
    kl_coef: 0.001
  bon_filter_high_acc_data: False

trainer:
  total_epochs: 30
  total_steps: null  # if total_steps is not None, it is prioritized over total_epochs
  project_name: verl_examples
  experiment_name: gsm8k
  logger: ['console', 'tracking']
  nnodes: 1
  n_gpus_per_node: 8
  save_freq: -1
  test_freq: 2
  critic_warmup: 0
  actor_update_freq: 1
  eval_before_training: False
  default_hdfs_dir: hdfs://haruna/home/byte_data_seed/lf_lq/user/zhangchi.usc1992/experiments/gsm8k/ppo/${trainer.experiment_name}
  default_local_dir: checkpoints/${trainer.project_name}/${trainer.experiment_name}
  val_only: False
  val_epoch: 1
  need_log: False
  log_file: /opt/tiger/alpha-seed/log.jsonl
  num_cases_to_wandb: 10 # number of samples log to wandb each step
  logger_step_interval: 5 # how many steps to log to wandb
  code_sandbox_psm: ""
  use_remote_sandbox: False
  save_cases_to_hdfs: True # save all cases to hdfs each step
  # auto: find the last ckpt to resume. If can't find, start from scratch
  resume_steps: auto
  ckpt_version: v1
  ckpt_enable_flatten: False
  set_fake_attention_mask: False
  fake_seqlen_ratio: 0.5
  league_training_config: 
    enable: False
    buffer_size: 1
    strategy: hard
    min_score: -1.0
    max_score: 1.0
  offload_train_memory: False

streaming_rollout:
  n_gpus_per_node: 0
  nnodes: 0
  warmup_step: 0
  force_eos: False

streaming_validator:
  n_gpus_per_node: 0
  nnodes: 0

convert_ckpt_to_omnistore_task:
  enable: False
