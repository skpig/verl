name: unit tests
trigger:
  change
jobs:
  e2e_optional_optimizer_test:
    # Merlin - data.aml.verl:v175
    image: hub.byted.org/reckon/data.reckon.mlx.image_5940:e2ec141539bafdc9109d4f1c9cfc42a8
    if: ${{ !contains(Event.Change.Title, "WIP") }}
    runs-on:
      cluster: gpu-h20
      docker:
        shared-memory: 1024
    envs:
      LIBHDFS_OPTS: -Dhadoop.root.logger=warn,console
    timeout: 30  # timeout 10min
    retry: 2
    steps:
      - name: check env
        commands:
        - nvidia-smi
      - &step_setup_bvc
        name: setup bvc
        commands:
          - curl -s bvc-cdn.byted.org/non_ttp_tao_deploy.sh | sudo bash
          - sudo ln -sf /usr/local/tao/agent/modules/bvc/bin/bvc /usr/bin/bvc
          - mkdir -p /opt/tiger/bvc/bin/; ln -sf /usr/local/tao/agent/modules/bvc/bin/bvc /opt/tiger/bvc/bin/bvc
      - &step_hadoop
        name: setup hadoop
        commands:
          - bash ./tests/tools/setup_hdfs.sh
      - &step_doas
        name: setup doas
        id: doas
        uses: actions/doas
      - &step_dependency
        name: setup dependency
        commands:
          - cd /opt/tiger
          - git clone -b 20250103 git@code.byted.org:seed/seed_models.git
          - cd seed_models
          - pip3 install -e . --user
          - cd /opt/tiger
          - git clone git@code.byted.org:data/verl
          - cd verl
          - pip3 install -e . --user
          - pip3 install --upgrade byted-wandb
          - pip3 install bytedance.ndtimeline==2.2.11
          - pip3 install byted-omnistore==0.7.14
          - pip3 install pylatexenc
          - pip3 install pydantic==1.10.15
          - cd /opt/tiger
          - git clone git@code.byted.org:data/byted_optimizer.git
          - cd byted_optimizer
          - git checkout ad30d9d0c1d23167a26ea84a9c4a84090ebb1277
          - pip3 install -r requirements.txt
          - pip3 install -v --disable-pip-version-check --no-cache-dir --no-build-isolation -e ./ --user

      - name: math v1 grpo, with adamw and lion optimizer from byted_optimizer
        commands:
          - cd -
          - export NUM_STEPS=2
          - export N_GPUS_PER_NODE=8
          - export NCCL_SHM_DISABLE=1
          - wandb offline
          - ray stop --force
          - ray start --num-cpus=100 --head
          - bash tasks_scripts/ci/run_m8_100m_math_v1_grpo.sh OPTIM=adamw BF16STATE=True
          - bash tasks_scripts/ci/run_m8_100m_math_v1_grpo.sh OPTIM=lion BF16STATE=True
          - ray stop --force
