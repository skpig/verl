name: unit tests
trigger:
  change
jobs:
  model_tests:
    image: hub.byted.org/reckon/data.reckon.mlx.image_5940:26def500fbbd577bdfd57f100f6aa993
    if: ${{ !contains(Event.Change.Title, "WIP") }}
    runs-on:
      cluster: NVIDIA_L20_16|hub.byted.org/reckon/data.reckon.mlx.image_5940:26def500fbbd577bdfd57f100f6aa993
    envs:
      LIBHDFS_OPTS: -Dhadoop.root.logger=warn,console
      SEC_TOKEN_PATH: ${{SEC_TOKEN_PATH}}
    timeout: 20
    retry: 3
    steps:
      - name: check env
        commands:
          - nvidia-smi

      - name: setup env
        commands:
          - sudo pip3 install --upgrade byted-wandb
          - sudo pip3 install byted-omnistore==0.7.14
          - sudo pip3 install --upgrade bytedance.ndtimeline
          - cd /opt/tiger
          - rm -rf seed_models mono_rl byted_optimizer
          - git clone git@code.byted.org:seed/seed_models
          - git clone git@code.byted.org:seed/mono_rl.git
          - export PYTHONPATH=/opt/tiger/seed_models:/opt/tiger/mono_rl:$PYTHONPATH

      - name: monkey patch tests
        commands:
          - cd /home/code
          - export PYTHONPATH=/opt/tiger/seed_models:/opt/tiger/mono_rl:$PYTHONPATH
          - pytest -s tests/models/transformers/test_ce_loss_op.py

      - name: parallelize tests
        commands:
          - cd /home/code
          - export NCCL_SHM_DISABLE=1
          - export PYTHONPATH=/opt/tiger/seed_models:/opt/tiger/mono_rl:$PYTHONPATH
          - pytest tests/parallelize/test_create_mesh.py
          - pytest tests/parallelize/test_parallel_init.py
          - pytest tests/parallelize/test_group_gemm_ep.py
          - pytest tests/parallelize/test_save_load.py
          - pytest tests/parallelize/test_train_memory_offload.py
          - pytest tests/parallelize/test_omnistore_reshard.py
