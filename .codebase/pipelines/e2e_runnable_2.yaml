name: unit tests
trigger:
  change
jobs:
  e2e_runnable_tests_2:
    # Merlin - data.aml.verl:v85
    image: hub.byted.org/reckon/data.reckon.mlx.image_5940:36aebfdb72c17e002e016c4594c602c4
    if: ${{ !contains(Event.Change.Title, "WIP") }}
    runs-on:
      cluster: gpu-l20-16
      docker:
        shared-memory: 1024
    envs:
      LIBHDFS_OPTS: -Dhadoop.root.logger=warn,console
    timeout: 30  # timeout 10min
    retry: 2
    steps:
      - name: check env
        commands:
        - nvidia-smi
      - &step_setup_bvc
        name: setup bvc
        commands:
          - curl -s bvc-cdn.byted.org/non_ttp_tao_deploy.sh | sudo bash
          - sudo ln -sf /usr/local/tao/agent/modules/bvc/bin/bvc /usr/bin/bvc
          - mkdir -p /opt/tiger/bvc/bin/; ln -sf /usr/local/tao/agent/modules/bvc/bin/bvc /opt/tiger/bvc/bin/bvc
      - &step_hadoop
        name: setup hadoop
        commands:
          - bash ./tests/tools/setup_hdfs.sh
      - &step_doas
        name: setup doas
        id: doas
        uses: actions/doas
      - &step_dependency
        name: setup dependency
        commands:
          - cd /opt/tiger
          - git clone -b 20250103 git@code.byted.org:seed/seed_models.git
          - cd seed_models
          - pip3 install -e . --user
          - cd /opt/tiger
          - git clone git@code.byted.org:data/verl
          - cd verl
          - pip3 install -e . --user
          - pip3 install bytedance.ndtimeline==2.2.11
          - pip3 install byted-omnistore==0.7.5
          - pip3 install pylatexenc
      - name: math v1 ppo async and grpo
        commands:
          - cd -
          - export NUM_STEPS=4
          - export N_GPUS_PER_NODE=8
          - export NCCL_SHM_DISABLE=1
          - wandb offline
          - ray stop --force
          - ray start --num-cpus=100 --head
          - bash tasks_scripts/ci/run_p6d_0b5_math_v1_ppo_async.sh
          - bash tasks_scripts/ci/run_p6d_0b5_math_v1_grpo.sh
          - ray stop --force