name: unit tests
trigger:
  change

jobs:
  vlm_e2e_runnable_tests:
    # Merlin - data.aml.verl:v205 
    image: hub.byted.org/reckon/data.reckon.mlx.image_5940:26def500fbbd577bdfd57f100f6aa993
    if: ${{ !contains(Event.Change.Title, "WIP") }}
    runs-on:
      cluster: NVIDIA_L20_16|hub.byted.org/reckon/data.reckon.mlx.image_5940:26def500fbbd577bdfd57f100f6aa993
    envs:
      LIBHDFS_OPTS: -Dhadoop.root.logger=warn,console
      SEC_TOKEN_PATH: ${{SEC_TOKEN_PATH}}
    timeout: 30
    retry: 2

    steps:
      - name: check env
        commands:
          - nvidia-smi

      - name: setup dependency
        commands:
          - cd /opt/tiger
          - rm -rf seed_models
          - git clone -b v1.3.0 git@code.byted.org:seed/seed_models.git
          - cd /opt/tiger
          - rm -rf mono_rl
          - git clone git@code.byted.org:seed/mono_rl.git
          - sudo pip3 install --upgrade byted-wandb
          - sudo pip3 install --upgrade bytedance.ndtimeline
          - sudo pip3 install byted-omnistore==0.7.14
          - sudo pip3 install pylatexenc
          - sudo pip3 install pydantic==1.10.15
          - sudo pip3 install pytest ray wandb

      - name: vlm hybrid engine tests
        commands:
          - export NCCL_SHM_DISABLE=1
          - export PYTHONPATH=/opt/tiger/mono_rl:/opt/tiger/seed_models:$PYTHONPATH
          - wandb offline
          - ray stop --force
          - ray start --num-cpus=100 --head
          - pytest -v tests/hybrid_engine/test_vlm.py
          - ray stop --force

      - name: vlm sync grpo
        commands:
          - cd /home/code
          - export NUM_STEPS=2
          - export N_GPUS_PER_NODE=8
          - export NCCL_SHM_DISABLE=1
          - export ALPHASEED_USE_NDTIMELINE=1
          - export PYTHONPATH=/opt/tiger/mono_rl:/opt/tiger/seed_models:$PYTHONPATH
          - export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
          - wandb offline
          - ray stop --force
          - ray start --num-cpus=100 --head
          - bash tasks_scripts/ci/run_vlm_680m.sh
          - bash tasks_scripts/ci/run_vlm_680m_rollout_server.sh
          - bash tasks_scripts/ci/run_vlm_680m_async.sh
          - ray stop --force
