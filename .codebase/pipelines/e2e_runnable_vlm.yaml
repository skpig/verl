name: unit tests
trigger:
  change
jobs:
  vlm_e2e_runnable_tests:
    # Merlin - seed.mono_rl.dev:v5
    image: hub.byted.org/reckon/data.reckon.mlx.image_10440:f01681fa57069fea9769780f4e25bba6
    if: ${{ !contains(Event.Change.Title, "WIP") }}
    runs-on:
      cluster: gpu-h20
      docker:
        shared-memory: 1024
    envs:
      LIBHDFS_OPTS: -Dhadoop.root.logger=warn,console
    timeout: 30  # timeout 10min
    retry: 2
    steps:
      - name: check env
        commands:
        - nvidia-smi
      - &step_setup_bvc
        name: setup bvc
        commands:
          - curl -s bvc-cdn.byted.org/non_ttp_tao_deploy.sh | sudo bash
          - sudo ln -sf /usr/local/tao/agent/modules/bvc/bin/bvc /usr/bin/bvc
          - mkdir -p /opt/tiger/bvc/bin/; ln -sf /usr/local/tao/agent/modules/bvc/bin/bvc /opt/tiger/bvc/bin/bvc
      - &step_hadoop
        name: setup hadoop
        commands:
          - bash ./tests/tools/setup_hdfs.sh
      - &step_doas
        name: setup doas
        id: doas
        uses: actions/doas
      - &step_dependency
        name: setup dependency
        commands:
          - cd /opt/tiger
          - git clone -b v1.3.0 git@code.byted.org:seed/seed_models.git
          - cd seed_models
          - pip3 install -e . --user
          - cd /opt/tiger
          - git clone git@code.byted.org:data/open_verl
          - mv open_verl verl
          - git clone git@code.byted.org:seed/mono_rl.git
          - pip3 install --upgrade byted-wandb
          - pip3 install bytedance.ndtimeline --upgrade
          - pip3 install byted-omnistore==0.7.14
          - pip3 install pylatexenc
          - pip3 install pydantic==1.10.15
      
      - name: vlm hybrid engine tests
        commands:
          - export NCCL_SHM_DISABLE=1
          - export PYTHONPATH=/opt/tiger/mono_rl:$PYTHONPATH
          - wandb offline
          - ray stop --force
          - ray start --num-cpus=100 --head
          - pytest -v tests/hybrid_engine/test_vlm.py
          - ray stop --force

      - name: vlm sync grpo
        commands:
          - cd -
          - export NUM_STEPS=2
          - export N_GPUS_PER_NODE=8
          - export NCCL_SHM_DISABLE=1
          - export ALPHASEED_USE_NDTIMELINE=1
          - export PYTHONPATH=/opt/tiger/mono_rl:$PYTHONPATH
          - wandb offline
          - ray stop --force
          - ray start --num-cpus=100 --head
          - bash tasks_scripts/ci/run_vlm_680m.sh
          - ray stop --force
