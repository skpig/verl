data:
  train_batch_size: 256
  micro_batch_size: 16  # this is also val batch size
  train_files: hdfs://haruna/home/byte_data_seed/ssd_hldy/user/chenjiaze/alphaseed_workspace/sft_data/0113_distill_RL/0.parquet
  val_files: hdfs://haruna/home/byte_data_seed/ssd_hldy/user/chenjiaze/alphaseed_workspace/sft_data/0113_distill_RL/0.parquet
  key: messages
  max_seq_length: 1024
  max_token_len: 2048
  truncation: error
  chat_template: null
model:
  path: hdfs://haruna/home/byte_data_seed/lf_lq/user/zhangchi.usc1992/models/gemma-1.1-7b-it  # huggingface path
  omnistore_path: null
  external_lib: null
  enable_gradient_checkpointing: False
  act_offload: False
  override_config: {}
  fsdp_config:
    cpu_offload: False
    enable_prefetch: True
  fuse_lm_head_ce_loss: True
  trust_remote_code: True
  sp_size: 1
  tp_size: 1
  use_rmpad: True
  use_dynamic_bsz: True
optim:
  type: adam
  lr: 1e-5
  betas: [0.9, 0.95]
  weight_decay: 0.01
  warmup_steps_ratio: 0.1
  max_grad_norm: 1.0
  min_lr_ratio: 0.1
  state_offload: False
  force_bfloat16_state: False  # whether to compress optimizer states to bf16

trainer:
  default_local_dir: /tmp/alpha_seed_sft
  default_hdfs_dir: hdfs://haruna/home/byte_data_seed/lf_lq/user/zhangchi.usc1992/experiments/gsm8k/gemma-1.1-7b-it/
  project_name: gsm8k-sft
  experiment_name: test
  total_epochs: 2
  logger: ['console']
  save_steps: 100
  eval_interval: 5  
  nnodes: 1
  n_gpus_per_node: 8
  seed: 42
