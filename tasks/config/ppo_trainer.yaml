  need_punish_duplicate: False
  punish_score: rule-lighteval/MATH_v2:-1,code-sandbox:0
  need_punish_trunc: False
  trunc_punish_score: -5
  strict_box_verify: False
  punish_format: False
  format_punish_score: -5
  use_cuda_timer: False # doesn't take effect; only for backward-compatibility
  length_ema_method: mean
  last_characters: -1 # number of last characters

algorithm:
  group_shuffle: False
  shuffle_sample_batch: False
  enable_rollout_log_probs: False
  dynamic_sampling:
    enable: False
    sync: True
    strategy: v3
    min_score: -1
    max_score: 1

  prior_sampling:
    enable: False
    prior_sampling_ema: 0.9
    only_filtering: False
    no_sample_max_threshold: 0.95
    no_sample_min_threshold: 0.05
    min_weight_clip: 0
    temperature: 1

  mask_overlong: False
  overlong_punish: v0
  overlong_punish_cache: 8192
  inference_scaling: v0
  inference_scaling_slope: 0.1

  no_length_reward: v0

  force_append_eos: False
  phasic_critic_interval: 0
  gamma: 1.0
  lam: 0.95
  use_variable_lambda: false
  variable_lambda_scalar: 0.2
  use_separate_critic_lam: False
  critic_lam: 1.0
  adv_estimator: gae
  adv_whiten: True
  kl_penalty: low_var_kl  # how to estimate kl divergence
  kl_ctrl:
    type: fixed
    kl_coef: 0.001
  bon_filter_high_acc_data: False
  group_mode: "normal"
  priority_sample: False
  TD_priority_ratio: 0.0
  use_model_output_mask: ${actor_rollout_ref.rollout.train_generate_kwargs.plugin_config.enable}

trainer:
  donot_resume_data: False

  use_grm: false
  use_remote_grm: false
  total_epochs: 30
  total_steps: null  # if total_steps is not None, it is prioritized over total_epochs
  project_name: verl_examples
  experiment_name: gsm8k
  logger: ['console', 'tracking']
  nnodes: 1
  n_gpus_per_node: 0
  save_freq: -1
  test_freq: 2
  critic_warmup: 0
  actor_update_freq: 1
  eval_before_training: False
  default_hdfs_dir: hdfs://haruna/home/byte_data_seed/lf_lq/user/zhangchi.usc1992/experiments/gsm8k/ppo/${trainer.experiment_name}
  default_local_dir: checkpoints/${trainer.project_name}/${trainer.experiment_name}
  val_only: False
  val_epoch: 1
  need_log: False
  log_file: /opt/tiger/alpha-seed/log.jsonl
  num_cases_to_wandb: 10 # number of samples log to wandb each step
  logger_step_interval: 5 # how many steps to log to wandb
  code_sandbox_psm: ""
  ci_sandbox_psm: ""
  verifier_service_psm: ""
  gaokao_verifier_service_psm: ""
  aider_service_psm: ""
  use_remote_aider_sandbox: False
  use_remote_swe_sandbox: False
  use_remote_sandbox: False
  use_remote_verifier: False
  use_remote_search: False
  save_cases_to_hdfs: True # save all cases to hdfs each step
  # auto: find the last ckpt to resume. If can't find, start from scratch
  resume_steps: auto
  auto_over_others: False
  ckpt_version: omnistore
  ckpt_enable_shm: False
  ckpt_upload_retry_count: 3
  remove_safetensors_after_init: False
  set_fake_attention_mask: False
  fake_seqlen_ratio: 0.5
  league_training_config: 
    enable: False
    buffer_size: 1
    strategy: hard
    min_score: -1.0
    max_score: 1.0
  queued_rollout_config: # train-gen split style rollout
    enable: False
    chunk_size: 32
    concurrency: ${data.train_batch_size}
    wait_condition: pool_ready_count # [pool_ready_count]
    max_buffer_size: -1
  offload_train_memory: False
  load_train_batch_path: null
  save_train_batch_dir: null
  per_query_max_length: False
  per_query_max_length_init: ${data.max_response_length}

  elastic:
    enable: false
    stable_pool_name: ""

rollout_server:
  handler: "math/aiohttp" # ["math/aiohttp"]
  external_lib: null # [null, /opt/tiger/agents_extension/handlers]
  timeout: 9600
  handler_kwargs: {}
  agent:
    executor_class: LocalExecutor  # ["RayActorExecutor", "LocalExecutor"]
    # max_workers * worker_max_concurrency 就是同时运行的task的最大并发数
    max_workers: 4 # 有多少worker
    worker_max_concurrency: 8192  # 每个worker的并发数，对所有executor类型都生效
    llm_request_concurrency: 0  # 每个worker调用llm的并发，默认0表示不限制，如果llm有限制的需要再调这个
    direct_submit_query: True  # 是否直接将query对象发给request manager，跳过http发给openai compatible serve的过程
  tool_call_start_token: "<tool_call>"
  tool_call_end_token: "</tool_call>"

streaming_rollout:
  n_gpus_per_node: 0
  nnodes: 0  # elastic模式下这个表示1个dp group所要的node，非elastic模式下，这个表示整个静态的standalone rollout总共要的nodes，里面包含所有的dp groups
  warmup_step: 0  # 这个字段似乎没被用到
  force_eos: False # only works for batch mode
  elastic:
    enable: false
    stable_pool_name: ""
    elastic_pool_name: elasticworker
    min_replicas: 1  # 最少的副本数，最小值会放在稳定资源池上跑，超过最小值的部分会放到弹性资源池上跑
    max_replicas: 100
    metrics_sampling_seconds: 5
    scale_up_threshold: 2  # 平均每个engine生成的并发度超过x就扩
    scale_up_wait: 20  # seconds，连续x seconds里的那个采样都超过threshold就扩
    scale_down_threshold: 2  # 类似上面
    scale_down_wait: 10  # 类似上面
  query_trace:
    enable: True
    from_step: 0
    to_step: 10
    store_decoding_output: False
    upload_to_mlx: True
  proxy:
    # 只对非elastic的server mode起作用，elastic一定是dynamic-balancing
    lb_mode: dynamic-balancing  # ["dynamic-balancing", "even-distribution"]
    poll_internal_seconds: 2.  # 1轮最短间隔
    rebalance_threshold: 2  # 最小溢出x个才重新分发给其他
    gmem_abundant_threshold: 0.15  # engine低于这个kv cache%时，不会被abort任何queries
    gmem_high_water_level_threshold: 0.90  # engine超过这个kv cache%时，不会被分发新的query
    gmem_insufficient_threshold: 0.95  # 超过这个kv cache%的query会从waiting列表里abort掉

streaming_validator:
  n_gpus_per_node: 0
  nnodes: 0
  elastic:
    enable: false
    stable_pool_name: ""

# 这是资源池的配置伸缩
elastic:
  # 这里只定义资源池名称，用于全局各个actor调度时指定label用，如果不需要指定任何资源池，改成空list
  resource_pools:
    stable_pool_names: ['byted_stable_resource']  # merlin里默认会用这两个名字
    elastic_pool_names: ['byted_unstable_resource']

  # HPA相关定义
  hpa:
    enable: false  # node HPA总开关
    pools:
      - name: elasticworker # merlin trial弹性伸缩池的role
        gpu_type: L20  # 从ray resource里读不到的时候会从这里读，暂时影响不大
        n_gpus_per_node: 0  # 从ray resource里读不到的时候会从这里读
        hard_min: 1 # 缩容时可缩到的最小值
        hard_max: 200  # 扩容时可缩到的物理最大值，一般是一个不太会达到的很大的值，暂时写一个数字避免扩爆
        buffer_size: 1  # extra idle buffer nodes

convert_ckpt_to_omnistore_task:
  enable: False

recipe: null
recipe_hub: hdfs://haruna/home/byte_data_seed/lf_lq/user/zhiqi.0/alphaseed/recipe_hub

server_client:
  role: null # [server,client]
  ray_address: null
  reset_server: False # for client

misc:
  aiomonitor:
    enable: False

mariana:
# Note that the current megatron config has to be global as it has to be identical for every model
# We may switch to per-model megatron config later when we separate models into different processes.
# During that time, the megatron config will be copied to the namespace under each model
  megatron:
    tensor_parallel_size: 2
    pipeline_parallel_size: 1
    virtual_pipeline_parallel_size: 0
    context_parallel_size: 1
    distributed_sequence_parallel_size: 1
    expert_parallel_size: ${mariana.megatron.tensor_parallel_size}  # hardcode for now
    micro_batch_size: 1
    global_batch_size: -1
    sequence_parallel: true  # must be true
    recompute_granularity: ''
    use_flash_attention: true
    recompute_method: uniform
    recompute_num_layers: 1
    distribute_saved_activations: false
    enable_distributed_optimizer: true  # must be true
    use_multi_precision_ddp: true  # must be true
    enable_initial_jit_warmup: false
    switch_pp_and_dp: false
    force_fp32_embed: false
    ddp_impl: local  # must be local
    bf16_qt: false
    empty_cache_level: 0
    grad_norm_skip: -1.0
    strict_align_diff_with_ds: false
    strict_align_row_para: false
    overlap_data_parallel_communication: false
    mem_efficient_column_parallel: true
    overlap_dp_grad_comm: true   # true
    overlap_dp_param_comm: true  # true
