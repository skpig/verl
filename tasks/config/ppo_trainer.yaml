data:
  tokenizer: null
  train_files: hdfs://haruna/home/byte_data_seed/lf_lq/user/zhangchi.usc1992/data/rlhf/gsm8k/train_with_ans_new.parquet
  val_files: hdfs://haruna/home/byte_data_seed/lf_lq/user/zhangchi.usc1992/data/rlhf/gsm8k/test_with_ans_new.parquet
  prompt_key: prompt
  answer_key: answer
  use_ref_answer: False
  max_prompt_length: 512
  max_response_length: 512
  train_batch_size: 1024
  val_batch_size: 1312
  return_raw_input_ids: False  # This should be set to true when the tokenizer between policy and rm differs
  return_raw_chat: False
  version: v2
  truncation: error
  shuffle: True
  multi_prompts: none
  num_prompts_per_data: 1
  BITWISE_RESUME: True  # this enables by default. If you seed checkpoint load fails, set to false


actor_rollout_ref:
  remove_o_bias: False
  update_gate_ema: False
  hybrid_engine: True
  model:
    path: hdfs://haruna/home/byte_data_seed/lf_lq/user/zhangchi.usc1992/models/deepseek-llm-7b-chat
    external_lib: null
    override_config: {}
    enable_gradient_checkpointing: False
    use_ce_loss_fusion: False
  actor:
    early_stop_by_kl: 0.0
    logits_clamp: 0.0
    strategy: fsdp  # This is for backward-compatibility
    ppo_mini_batch_size: 512
    ulysses_sequence_parallel_size: 1
    fsdp_size: -1
    tp_size: 1
    ppo_micro_batch_size: 64
    use_dynamic_bsz: True
    ppo_max_token_len: -1
    grad_clip: 1.0
    clip_ratio: 0.2
    clip_ratio2: 10.0
    scale_pg_by_kl: False
    scale_pg_by_local_kl: False
    upgo_loss_weight: 0.0
    upgo_loss_version: 1
    kl_loss_weight: 0.0
    lm_loss_weight: 0.0
    kl_penalty: ${algorithm.kl_penalty}
    entropy_coeff: 0.001
    ppo_epochs: 1
    shuffle: True
    use_ewma_loss: False
    act_offload: False
    train_memory_offload: ${trainer.offload_train_memory}
    optim:
      lr: 1e-5
      betas: [0.9, 0.95]
      eps: 1e-08
      weight_decay: 0.1
      lr_warmup_steps: -1
      lr_warmup_steps_ratio: 0.  # the total steps will be injected during runtime
      min_lr_ratio: null   # only useful for warmup with cosine
      warmup_style: constant  # select from constant/cosine
      total_training_steps: -1  # must be override by program
    fsdp_config:
      wrap_policy:
        # transformer_layer_cls_to_wrap: None
        min_num_params: 0
      param_offload: False
      use_orig_params: True
    enable_training_stats: False
    profile:
      filename: p6_400m_ppo_actor
      profile_on_ranks: null
      upload_to_mlx: False
      enable: False
      warmup: 5
      wait: 10
      active: 2
      mem_enable: False
  ref:
    strategy: fsdp
    fsdp_config:
      param_offload: True
      use_orig_params: True
      wrap_policy:
        # transformer_layer_cls_to_wrap: None
        min_num_params: 0
    ppo_mini_batch_size: ${actor_rollout_ref.actor.ppo_mini_batch_size}
    log_prob_micro_batch_size: 128
    ulysses_sequence_parallel_size: 1
    fsdp_size: -1
    tp_size: 1
    use_dynamic_bsz: True
    max_token_len: -1
    ema: 1.0
  rollout:
    ban_eos: v0
    name: xperf_gpt
    prompt_length: ${data.max_prompt_length}  # for xperf_gpt
    response_length: ${data.max_response_length}
    # for vllm rollout
    dtype: bfloat16 # should align with FSDP
    ignore_eos: False
    enforce_eager: True
    free_cache_engine: True
    load_format: dummy_dtensor
    tensor_model_parallel_size: 2
    max_num_batched_tokens: 8192
    max_num_seqs: 1024
    use_dynamic_bsz: True
    max_token_len: -1
    log_prob_micro_batch_size: 128
    # for xperf_gpt
    micro_batch_size: 2048
    num_bon: 1
    eval_bon: 1
    eval_bon_every: 20
    bon_strategy: "best"
    quant_mode: "NO_QUANT"
    gpu_memory_utilization: 0.7
    schedule_strategy: default # [default,fifo]
    train_generate_kwargs:
      top_k: -1 # 0 for hf rollout, -1 for vllm rollout
      top_p: 1.0
      temperature: 1.0
      do_sample: True
      min_p: -1 # 0.01 to open
      eta_epsilon: -1 # 1e-6 to open
      logits_clamp: ${actor_rollout_ref.actor.logits_clamp}
      max_new_tokens: ${data.max_response_length}
    val_generate_kwargs:
      # for validation
      top_k: -1 # 0 for hf rollout, -1 for vllm rollout
      top_p: 0.7
      temperature: 1.0
      do_sample: True
      max_new_tokens: ${data.max_response_length}
    profile:
      filename: p6_400m_ppo_rollout
      profile_on_ranks:
        - 0
      profile_at_steps:
        - 0
      profile_first_n_execs: 3
      default_hdfs_dir: null
      upload_to_mlx: False
      enable: False
    rollout_pool:
      nnodes: 1
      warmup_step: 0
  streaming_rollout_args: ${streaming_rollout}
  streaming_validator_args: ${streaming_validator}
  use_cuda_timer: False # deprecated

critic:
  remove_o_bias: False
  update_gate_ema: False
  load_score_head: True
  strategy: fsdp
  optim:
    lr: 1e-5
    betas: [0.9, 0.95]
    eps: 1e-08
    weight_decay: 0.1
    lr_warmup_steps: -1
    lr_warmup_steps_ratio: 0.  # the total steps will be injected during runtime
    min_lr_ratio: null   # only useful for warmup with cosine
    warmup_style: constant  # select from constant/cosine
    total_training_steps: -1  # must be override by program
  model:
    path: hdfs://haruna/home/byte_data_seed/lf_lq/user/zhangchi.usc1992/models/deepseek-llm-7b-chat
    tokenizer_path: ${actor_rollout_ref.model.path}
    override_config: {}
    external_lib: ${actor_rollout_ref.model.external_lib}
    enable_gradient_checkpointing: False
    fsdp_config:
      param_offload: False
      wrap_policy:
        # transformer_layer_cls_to_wrap: None
        min_num_params: 0
      use_orig_params: True
  ulysses_sequence_parallel_size: 1
  fsdp_size: -1
  tp_size: 1
  NO_DEVICE_MESH: False # handle old critic ckpt stored as ShardedTensor
  ppo_mini_batch_size: ${actor_rollout_ref.actor.ppo_mini_batch_size}
  ppo_micro_batch_size: 64
  use_dynamic_bsz: True
  ppo_max_token_len: -1
  infer_micro_batch_size: 128
  ppo_epochs: 1
  phasic_critic_epochs: 1
  shuffle: ${actor_rollout_ref.actor.shuffle}
  grad_clip: 1.0
  cliprange_value: 0.5
  act_offload: False
  train_memory_offload: ${trainer.offload_train_memory}
  profile:
    filename: p6_400m_ppo_critic
    profile_on_ranks: null
    default_hdfs_dir: null
    upload_to_mlx: False
    enable: False
    warmup: 5
    wait: 10
    active: 2
    mem_enable: False
  use_cuda_timer: False # deprecated

reward_model:
  len_ema_json: null
  enable: False
  model:
    input_tokenizer: ${actor_rollout_ref.model.path}  # set this to null if the chat template is identical
    path: hdfs://haruna/home/byte_data_seed/lf_lq/user/zhangchi.usc1992/models/FsfairX-LLaMA3-RM-v0.1
    external_lib: ${actor_rollout_ref.model.external_lib}
    fsdp_config:
      min_num_params: 0
      param_offload: True
      use_orig_params: True
  ulysses_sequence_parallel_size: 1
  fsdp_size: -1
  tp_size: 1
  micro_batch_size: 64
  use_dynamic_bsz: True
  max_token_len: -1
  max_length: null
  max_prompt_length: ${data.max_prompt_length}
  max_response_length: ${data.max_response_length}
  mean: 0.0
  std: 1.0
  use_last_response: False
  last_response_strict: False
  reward_executor_maxnum: 128
  last_response_sep: ['<summarize>', '</summarize>']
  reward_0_for_overlong_rsp: False
  len_ema_lambda: 1.0
  add_int_verify: False
  punish_no_answer: v0
  need_punish_duplicate: False
  punish_score: rule-lighteval/MATH_v2:-1,code-sandbox:0
  need_punish_trunc: False
  trunc_punish_score: -5
  strict_box_verify: False
  punish_format: False
  format_punish_score: -5
  use_cuda_timer: False # deprecated
  length_ema_method: mean

algorithm:
  prior_sampling: 
    enable: False
    prior_sampling_ema: 0.9
    no_sample_threshold: 0.99

  mask_overlong: False
  overlong_punish: v0
  overlong_punish_cache: 8192
  inference_scaling: v0
  inference_scaling_slope: 0.1

  no_length_reward: v0

  force_append_eos: False
  phasic_critic_interval: 0
  gamma: 1.0
  lam: 0.95
  use_separate_critic_lam: False
  critic_lam: 1.0
  adv_estimator: gae
  adv_whiten: True
  kl_penalty: low_var_kl  # how to estimate kl divergence
  kl_ctrl:
    type: fixed
    kl_coef: 0.001
  bon_filter_high_acc_data: False
  group_mode: "normal"

trainer:
  total_epochs: 30
  total_steps: null  # if total_steps is not None, it is prioritized over total_epochs
  project_name: verl_examples
  experiment_name: gsm8k
  logger: ['console', 'tracking']
  nnodes: 1
  n_gpus_per_node: 8
  save_freq: -1
  test_freq: 2
  critic_warmup: 0
  actor_update_freq: 1
  eval_before_training: False
  default_hdfs_dir: hdfs://haruna/home/byte_data_seed/lf_lq/user/zhangchi.usc1992/experiments/gsm8k/ppo/${trainer.experiment_name}
  default_local_dir: checkpoints/${trainer.project_name}/${trainer.experiment_name}
  val_only: False
  val_epoch: 1
  need_log: False
  log_file: /opt/tiger/alpha-seed/log.jsonl
  num_cases_to_wandb: 10 # number of samples log to wandb each step
  logger_step_interval: 5 # how many steps to log to wandb
  code_sandbox_psm: ""
  verifier_service_psm: ""
  use_remote_sandbox: False
  use_remote_verifier: False
  save_cases_to_hdfs: True # save all cases to hdfs each step
  # auto: find the last ckpt to resume. If can't find, start from scratch
  resume_steps: auto
  auto_over_others: False
  ckpt_version: v1
  ckpt_enable_shm: False
  ckpt_upload_retry_count: 3
  remove_safetensors_after_init: False
  set_fake_attention_mask: False
  fake_seqlen_ratio: 0.5
  league_training_config: 
    enable: False
    buffer_size: 1
    strategy: hard
    min_score: -1.0
    max_score: 1.0
  offload_train_memory: False
  load_train_batch_path: null
  save_train_batch_dir: null
  per_query_max_length: False
  per_query_max_length_init: ${data.max_response_length}

streaming_rollout:
  n_gpus_per_node: 0
  nnodes: 0
  warmup_step: 0
  force_eos: False

streaming_validator:
  n_gpus_per_node: 0
  nnodes: 0

convert_ckpt_to_omnistore_task:
  enable: False

recipe: null

server_client:
  role: null # [server,client]
  ray_address: null
  reset_server: False # for client
