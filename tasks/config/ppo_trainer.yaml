    think_end: </think>

actor_rollout_ref:
  remove_o_bias: False
  freeze_gate: False
  update_gate_ema: False
  hybrid_engine: True
  model:
    path: hdfs://haruna/home/byte_data_seed/lf_lq/user/zhangchi.usc1992/models/deepseek-llm-7b-chat
    tokenizer_path: ${actor_rollout_ref.model.path}
    external_lib: null
    override_config: {}
    enable_gradient_checkpointing: False
    use_ce_loss_fusion: False

  # note that this is only a placeholder. It will be overriden to global mariana config at runtime
  mariana: null  

  actor:
    early_stop_by_kl: 0.0
    logits_clamp: 0.0
    strategy: fsdp  # This is for backward-compatibility
    ppo_mini_batch_size: 512
    max_ppo_mini_batch: -1
    ulysses_sequence_parallel_size: 1
    fsdp_size: -1
    tp_size: 1
    tp_outside: false
    oe_size: 1
    ppo_micro_batch_size: 64
    use_dynamic_bsz: True
    ppo_max_token_len: -1
    grad_clip: 1.0
    clip_ratio: 0.2
    clip_ratio_low: null
    clip_ratio_high: null
    clip_ratio2: 10.0
    loss_average_method: "sample"  # "token", "minibatch", "batch", "constant"
    loss_average_constant: 0
    scale_pg_by_kl: False
    scale_pg_by_local_kl: False
    upgo_loss_weight: 0.0
    upgo_loss_version: 1
    kl_loss_weight: 0.0
    offpolicy_kl_loss_weight: 0.0
    lm_loss_weight: 0.0
    kl_penalty: ${algorithm.kl_penalty}
    use_model_output_mask: ${algorithm.use_model_output_mask}
    entropy_coeff: 0.001
    ppo_epochs: 1
    shuffle: True
    use_ewma_loss: False
    act_offload: False
    act_offload_upbound: null
    act_offload_buff_size: 32
    act_offload_pin_memory: false
    gc_freq: null # null, "micro", "mini"
    train_memory_offload: ${trainer.offload_train_memory}
    optim:
      type: adam
      lr: 1e-5
      betas: [0.9, 0.95]
      eps: 1e-08
      weight_decay: 0.1
      lr_warmup_steps: -1
      lr_warmup_steps_ratio: 0.  # the total steps will be injected during runtime
      min_lr_ratio: null   # only useful for warmup with cosine
      warmup_style: constant  # select from constant/cosine
      total_training_steps: -1  # must be override by program
      force_bfloat16_state: False  # wether to compress optimizer states to bf16
    fsdp_config:
      wrap_policy:
        # transformer_layer_cls_to_wrap: None
        min_num_params: 0
      param_offload: False
    enable_training_stats: False
    profile:
      filename: p6_400m_ppo_actor
      profile_on_ranks: null
      upload_to_mlx: False
      enable: False
      warmup: 5
      wait: 10
      active: 2
      mem_enable: False
  ref:
    strategy: fsdp
    fsdp_config:
      param_offload: True
      wrap_policy:
        # transformer_layer_cls_to_wrap: None
        min_num_params: 0
    ppo_mini_batch_size: ${actor_rollout_ref.actor.ppo_mini_batch_size}
    log_prob_micro_batch_size: 128
    ulysses_sequence_parallel_size: 1
    fsdp_size: -1
    tp_size: 1
    tp_outside: false
    oe_size: 1
    use_dynamic_bsz: True
    max_token_len: -1
    ema: 1.0
  rollout:
    ban_eos: v0
    name: xperf_gpt
    prompt_length: ${data.max_prompt_length}  # for xperf_gpt
    response_length: ${data.max_response_length}
    vit_use_xperf_gpt: False # if false, vit will use torch vit
    # for vllm rollout
    dtype: bfloat16 # should align with FSDP
    ignore_eos: False
    enforce_eager: True
    free_cache_engine: True
    load_format: dummy_dtensor
    tensor_model_parallel_size: 1
    max_num_batched_tokens: 8192
    max_num_seqs: 1024
    use_dynamic_bsz: True
    max_token_len: -1
    log_prob_micro_batch_size: 128
    # for xperf_gpt
    micro_batch_size: 2048
    num_bon: 1
    eval_bon: 1
    eval_bon_every: 20
    bon_strategy: "best"
    quant_mode: "NO_QUANT"
    gpu_memory_utilization: 0.7
    schedule_strategy: default # [default,fifo]
    mode: "batch" # [batch, server]
    weights_communicator: "nccl" # [nccl, ucx], elastic模式下只能用ucx
    prefix_cache_slot_num: -1
    prefix_cache_max_length: -1
    plugin: &plugin_config
      enable: False
      plugin_external_lib: null # [null, '/opt/tiger/agents_extension/plugins']
      env_external_lib: null # [null, '/opt/tiger/agents_extension/envs']
      names: []
      args: null # null or dict[name, kwargs]
      pause_condition: on_trigger # [on_trigger, on_eos]
      max_round: null
      edit_history: null  # [null]
      timeout: 300
      execution_mode: sequential # ['concurrent', 'sequential'], how to exec multiple plugin calls
      remote_verify_config:
        enable: False
        base_url: ["http://[2605:340:cd51:a00:ddd5:7c23:6bbf:884f]:8010/v1/chat/completions"]
        model: 'Qwen2.5-32B-Instruct'
        max_concurrency: 1024
        max_batch_size: 1024
        max_try: 1
        judge_prompt_ver: "v1"
        async: False
        enable_think_format: False
        think_format_coef: 0
        ans_begin_str: "<ans>"
        ans_end_str: "</ans>"
      search_engine: "toutiao"
      search_psm: 'rlhf_horizon'
      max_env_response: null
      max_turn: 10
      adaptive_max_turn:
        enable: False
        type: "ema"
        alpha: 0.6
        beta: 1.5
        discount: 0.5
        step_interval: 25
        max_turn_limit: 64
      turn_max_new_tokens: 2048
      fc_type: 'function'
      server_type: 'independent'
      jupyter_server_id: 46390435
      external_llm_psm: "http://[2605:340:cd51:a00:d25b:c6fb:3eeb:6f18]:8010/v1/chat/completions"
      external_llm_type: "Qwen2.5-32B-Instruct"
    train_generate_kwargs: &train_gen_config
      top_k: -1 # 0 for hf rollout, -1 for vllm rollout
      top_p: 1.0
      temperature: 1.0
      do_sample: True
      min_p: -1 # 0.01 to open
      eta_epsilon: -1 # 1e-6 to open
      logits_clamp: ${actor_rollout_ref.actor.logits_clamp}
      max_new_tokens: ${data.max_response_length}
      plugin_config: ${actor_rollout_ref.rollout.plugin}
    val_generate_kwargs:
      <<: *train_gen_config
      top_p: 0.7
    profile:
      filename: p6_400m_ppo_rollout
      profile_on_ranks:
        - 0
      profile_at_steps:
        - 0
      profile_first_n_execs: 3
      default_hdfs_dir: null
      upload_to_mlx: False
      enable: False
    rollout_pool:
      nnodes: 1
      warmup_step: 0
      clear_rollout_pool: False
      upsample_mode: batch # batch, mini_batch
    xperf_custom:
      enable: False
      backbone: null
      preset: null
    xperf_triton:
      enable: False
      use_paged_attn: False
      max_batch_size: 32
      max_ctx_batch_size: 8
      num_slots: 32
    enable_cuda_graph: False
    enable_paged_attention: True
    rollout_server_args: ${rollout_server}
    agent:
      max_turns: 10
      target_score: 0.5
      enable_prefix_sampling: False
      show_error_case_prob: 0.7
      max_new_tokens_per_turn: ${data.max_response_length}
  streaming_rollout_args: ${streaming_rollout}
  streaming_validator_args: ${streaming_validator}
  use_cuda_timer: False # doesn't take effect; only for backward-compatibility
  

